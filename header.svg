<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background card with rounded corners and border -->
  <rect width="900" height="240" rx="16" fill="url(#bgGradient)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Ambient glowing spheres (pure SVG native, 100% compatible with GitHub camo) -->
  <circle cx="100" cy="50" r="140" fill="url(#glow1)" filter="url(#blurFilter)" />
  <circle cx="800" cy="190" r="130" fill="url(#glow2)" filter="url(#blurFilter)" />

  <!-- Status pill container -->
  <g transform="translate(310, 30)">
    <rect width="280" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="18" cy="14" r="4" fill="#10b981" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1">OPEN TO COLLABORATIONS</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#textGradient)" letter-spacing="-0.5">Akshat Kumar Sinha</text>

  <!-- Subtitle -->
  <text x="450" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
    <tspan fill="#e2e8f0" font-weight="600">Full-Stack Engineer</tspan>
    <tspan fill="#475569"> • </tspan>
    <tspan fill="#e2e8f0" font-weight="600">SDET &amp; QA Automation</tspan>
    <tspan fill="#475569"> • </tspan>
    <tspan fill="#e2e8f0" font-weight="600">Next.js &amp; React</tspan>
    <tspan fill="#475569"> • </tspan>
    <tspan fill="#e2e8f0" font-weight="600">Unity (Beginner)</tspan>
  </text>

  <!-- Tag Pills -->
  <g transform="translate(145, 182)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="26" rx="6" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" />
    <text x="65" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#a5b4fc">☕ Java &amp; Core C/C++</text>

    <!-- Tag 2 -->
    <rect x="140" y="0" width="145" height="26" rx="6" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" />
    <text x="212" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#a5b4fc">⚛️ React &amp; Next.js</text>

    <!-- Tag 3 -->
    <rect x="295" y="0" width="165" height="26" rx="6" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" />
    <text x="377" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#a5b4fc">🤖 Selenium &amp; Cucumber</text>

    <!-- Tag 4 -->
    <rect x="470" y="0" width="140" height="26" rx="6" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" />
    <text x="540" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#a5b4fc">🎮 Unity Game Dev</text>
  </g>
</svg>