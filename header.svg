<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" role="img" aria-label="Akshat Kumar Sinha — Build with intent. Automate the repetitive. Understand the fundamentals. Improve relentlessly.">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>

    <!-- Main accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Soft ambient light -->
    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#818cf8" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Very subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#64748b"
        stroke-opacity=".045"
        stroke-width="1"
      />
    </pattern>

    <!-- Glow -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <rect
    width="1200"
    height="360"
    rx="20"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="360"
    rx="20"
    fill="url(#grid)"
  />

  <!-- Ambient lighting -->
  <circle
    cx="170"
    cy="90"
    r="180"
    fill="url(#cyanGlow)"
    filter="url(#blur)"
  />

  <circle
    cx="1050"
    cy="285"
    r="200"
    fill="url(#purpleGlow)"
    filter="url(#blur)"
  />


  <!-- ====================================================== -->
  <!-- BORDER -->
  <!-- ====================================================== -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="358"
    rx="20"
    fill="none"
    stroke="#38bdf8"
    stroke-opacity=".18"
  />


  <!-- ====================================================== -->
  <!-- TOP SYSTEM LINE -->
  <!-- ====================================================== -->

  <g transform="translate(70 48)">

    <circle
      cx="5"
      cy="5"
      r="4"
      fill="#38bdf8"
    />

    <circle
      cx="5"
      cy="5"
      r="9"
      fill="none"
      stroke="#38bdf8"
      stroke-opacity=".25"
    >
      <animate
        attributeName="r"
        values="7;12;7"
        dur="2.5s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values=".8;0;.8"
        dur="2.5s"
        repeatCount="indefinite"
      />
    </circle>

    <text
      x="22"
      y="9"
      font-family="monospace"
      font-size="10"
      letter-spacing="2"
      fill="#64748b"
    >
      ENGINEERING / SYSTEMS / AUTOMATION
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- NAME -->
  <!-- ====================================================== -->

  <text
    x="70"
    y="125"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
    font-size="48"
    font-weight="800"
    letter-spacing="-1.5"
    fill="#f8fafc"
  >
    Akshat Kumar Sinha
  </text>


  <!-- Small identity line -->

  <text
    x="73"
    y="151"
    font-family="monospace"
    font-size="11"
    letter-spacing="2"
    fill="#64748b"
  >
    BUILD • AUTOMATE • UNDERSTAND • ITERATE
  </text>


  <!-- ====================================================== -->
  <!-- PHILOSOPHY -->
  <!-- ====================================================== -->

  <g transform="translate(70 190)">

    <!-- Connecting line -->

    <line
      x1="8"
      y1="24"
      x2="1038"
      y2="24"
      stroke="#334155"
      stroke-width="1"
    />

    <line
      x1="8"
      y1="24"
      x2="1038"
      y2="24"
      stroke="url(#accent)"
      stroke-width="1"
      stroke-opacity=".35"
    >
      <animate
        attributeName="stroke-dasharray"
        values="0 1200;120 1080;0 1200"
        dur="5s"
        repeatCount="indefinite"
      />
    </line>


    <!-- ===================== -->
    <!-- 01 -->
    <!-- ===================== -->

    <g>

      <circle
        cx="8"
        cy="24"
        r="8"
        fill="#08111f"
        stroke="#38bdf8"
        stroke-width="1.5"
      />

      <circle
        cx="8"
        cy="24"
        r="3"
        fill="#38bdf8"
      />

      <text
        x="0"
        y="-3"
        font-family="monospace"
        font-size="9"
        letter-spacing="1.5"
        fill="#38bdf8"
      >
        01
      </text>

      <text
        x="0"
        y="55"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="15"
        font-weight="700"
        fill="#f8fafc"
      >
        Build with intent.
      </text>

      <text
        x="0"
        y="75"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5"
        fill="#64748b"
      >
        Solve the right problem.
      </text>

    </g>


    <!-- ===================== -->
    <!-- 02 -->
    <!-- ===================== -->

    <g transform="translate(270 0)">

      <circle
        cx="8"
        cy="24"
        r="8"
        fill="#0a1020"
        stroke="#60a5fa"
        stroke-width="1.5"
      />

      <circle
        cx="8"
        cy="24"
        r="3"
        fill="#60a5fa"
      />

      <text
        x="0"
        y="-3"
        font-family="monospace"
        font-size="9"
        letter-spacing="1.5"
        fill="#60a5fa"
      >
        02
      </text>

      <text
        x="0"
        y="55"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="15"
        font-weight="700"
        fill="#f8fafc"
      >
        Automate the repetitive.
      </text>

      <text
        x="0"
        y="75"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5"
        fill="#64748b"
      >
        Let systems do the boring work.
      </text>

    </g>


    <!-- ===================== -->
    <!-- 03 -->
    <!-- ===================== -->

    <g transform="translate(540 0)">

      <circle
        cx="8"
        cy="24"
        r="8"
        fill="#0c1020"
        stroke="#818cf8"
        stroke-width="1.5"
      />

      <circle
        cx="8"
        cy="24"
        r="3"
        fill="#818cf8"
      />

      <text
        x="0"
        y="-3"
        font-family="monospace"
        font-size="9"
        letter-spacing="1.5"
        fill="#818cf8"
      >
        03
      </text>

      <text
        x="0"
        y="55"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="15"
        font-weight="700"
        fill="#f8fafc"
      >
        Understand the fundamentals.
      </text>

      <text
        x="0"
        y="75"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5"
        fill="#64748b"
      >
        Don't hide behind abstractions.
      </text>

    </g>


    <!-- ===================== -->
    <!-- 04 -->
    <!-- ===================== -->

    <g transform="translate(810 0)">

      <circle
        cx="8"
        cy="24"
        r="8"
        fill="#100d20"
        stroke="#c084fc"
        stroke-width="1.5"
      />

      <circle
        cx="8"
        cy="24"
        r="3"
        fill="#c084fc"
      />

      <text
        x="0"
        y="-3"
        font-family="monospace"
        font-size="9"
        letter-spacing="1.5"
        fill="#c084fc"
      >
        04
      </text>

      <text
        x="0"
        y="55"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="15"
        font-weight="700"
        fill="#f8fafc"
      >
        Improve relentlessly.
      </text>

      <text
        x="0"
        y="75"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5"
        fill="#64748b"
      >
        Ship. Learn. Refactor. Repeat.
      </text>

    </g>

  </g>


  <!-- ====================================================== -->
  <!-- BOTTOM TERMINAL SIGNATURE -->
  <!-- ====================================================== -->

  <g transform="translate(70 320)">

    <text
      x="0"
      y="0"
      font-family="monospace"
      font-size="10"
      fill="#38bdf8"
    >
      $
    </text>

    <text
      x="15"
      y="0"
      font-family="monospace"
      font-size="10"
      fill="#64748b"
    >
      make
    </text>

    <text
      x="55"
      y="0"
      font-family="monospace"
      font-size="10"
      fill="#a5b4fc"
    >
      better_systems
    </text>

    <text
      x="205"
      y="0"
      font-family="monospace"
      font-size="10"
      fill="#475569"
    >
      // one iteration at a time
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- CORNER MARKS -->
  <!-- ====================================================== -->

  <path
    d="M25 60V25H60"
    fill="none"
    stroke="#38bdf8"
    stroke-width="1.5"
    stroke-opacity=".55"
  />

  <path
    d="M1175 300V335H1140"
    fill="none"
    stroke="#c084fc"
    stroke-width="1.5"
    stroke-opacity=".55"
  />

</svg>
