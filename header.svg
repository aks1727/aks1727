<defs>

  <!-- ====================================================== -->
  <!-- LIGHT ANIMATED BACKGROUND -->
  <!-- ====================================================== -->

  <linearGradient
    id="bg"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="100%"
  >

    <stop offset="0%" stop-color="#E0F2FE">
      <animate
        attributeName="stop-color"
        values="#E0F2FE;#DBEAFE;#E0E7FF;#E0F2FE"
        dur="18s"
        repeatCount="indefinite"
      />
    </stop>

    <stop offset="35%" stop-color="#DBEAFE">
      <animate
        attributeName="stop-color"
        values="#DBEAFE;#E0E7FF;#EDE9FE;#DBEAFE"
        dur="18s"
        repeatCount="indefinite"
      />
    </stop>

    <stop offset="65%" stop-color="#EDE9FE">
      <animate
        attributeName="stop-color"
        values="#EDE9FE;#F5F3FF;#E0F2FE;#EDE9FE"
        dur="18s"
        repeatCount="indefinite"
      />
    </stop>

    <stop offset="100%" stop-color="#F5F3FF">
      <animate
        attributeName="stop-color"
        values="#F5F3FF;#EDE9FE;#DBEAFE;#F5F3FF"
        dur="18s"
        repeatCount="indefinite"
      />
    </stop>

  </linearGradient>


  <!-- ====================================================== -->
  <!-- ACCENT -->
  <!-- ====================================================== -->

  <linearGradient
    id="accent"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="0%"
  >
    <stop offset="0%" stop-color="#0284C7"/>
    <stop offset="50%" stop-color="#6366F1"/>
    <stop offset="100%" stop-color="#9333EA"/>
  </linearGradient>


  <!-- ====================================================== -->
  <!-- CYAN LIGHT -->
  <!-- ====================================================== -->

  <radialGradient id="cyanGlow">

    <stop
      offset="0%"
      stop-color="#38BDF8"
      stop-opacity=".20"
    />

    <stop
      offset="45%"
      stop-color="#7DD3FC"
      stop-opacity=".10"
    />

    <stop
      offset="100%"
      stop-color="#7DD3FC"
      stop-opacity="0"
    />

  </radialGradient>


  <!-- ====================================================== -->
  <!-- PURPLE LIGHT -->
  <!-- ====================================================== -->

  <radialGradient id="purpleGlow">

    <stop
      offset="0%"
      stop-color="#A78BFA"
      stop-opacity=".18"
    />

    <stop
      offset="45%"
      stop-color="#C4B5FD"
      stop-opacity=".10"
    />

    <stop
      offset="100%"
      stop-color="#C4B5FD"
      stop-opacity="0"
    />

  </radialGradient>


  <!-- ====================================================== -->
  <!-- SUBTLE GRID -->
  <!-- ====================================================== -->

  <pattern
    id="grid"
    width="40"
    height="40"
    patternUnits="userSpaceOnUse"
  >

    <path
      d="M40 0H0V40"
      fill="none"
      stroke="#64748B"
      stroke-opacity=".055"
      stroke-width="1"
    />

  </pattern>


  <!-- ====================================================== -->
  <!-- SOFT BLUR -->
  <!-- ====================================================== -->

  <filter id="blur">
    <feGaussianBlur stdDeviation="50"/>
  </filter>

</defs>


<!-- ====================================================== -->
<!-- BACKGROUND -->
<!-- ====================================================== -->

<rect
  width="1200"
  height="360"
  rx="20"
  fill="url(#bg)"
/>


<!-- ====================================================== -->
<!-- MOVING LIGHT -->
<!-- ====================================================== -->

<circle
  cx="160"
  cy="70"
  r="210"
  fill="url(#cyanGlow)"
  filter="url(#blur)"
>

  <animate
    attributeName="cx"
    values="160;310;160"
    dur="16s"
    repeatCount="indefinite"
  />

  <animate
    attributeName="cy"
    values="70;125;70"
    dur="13s"
    repeatCount="indefinite"
  />

</circle>


<circle
  cx="1040"
  cy="290"
  r="230"
  fill="url(#purpleGlow)"
  filter="url(#blur)"
>

  <animate
    attributeName="cx"
    values="1040;900;1040"
    dur="18s"
    repeatCount="indefinite"
  />

  <animate
    attributeName="cy"
    values="290;230;290"
    dur="15s"
    repeatCount="indefinite"
  />

</circle>


<!-- ====================================================== -->
<!-- SUBTLE GRID -->
<!-- ====================================================== -->

<rect
  width="1200"
  height="360"
  rx="20"
  fill="url(#grid)"
/>


<!-- ====================================================== -->
<!-- GLASS-LIKE INNER SURFACE -->
<!-- ====================================================== -->

<rect
  x="18"
  y="18"
  width="1164"
  height="324"
  rx="16"
  fill="#FFFFFF"
  fill-opacity=".16"
  stroke="#FFFFFF"
  stroke-opacity=".45"
  stroke-width="1"
/>


<!-- ====================================================== -->
<!-- BORDER -->
<!-- ====================================================== -->

<rect
  x="1"
  y="1"
  width="1198"
  height="358"
  rx="20"
  fill="none"
  stroke="#FFFFFF"
  stroke-opacity=".65"
  stroke-width="1"
/>
